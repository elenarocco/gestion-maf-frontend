<div class="layout">
  <aside class="sidebar">
    <div class="marca">
      <img src="logo-maf.png" alt="MAF Chile">
      <div class="marca-texto">
        <strong>GestiónTI</strong>
        <span>MAF Chile</span>
      </div>
    </div>

    <nav>
      @for (item of menuActual(); track item.ruta) {
        <a [routerLink]="item.ruta" [class.activo]="item.ruta === rutaActiva()">{{ item.nombre }}</a>
      }
    </nav>

    @if (sesion.usuario(); as u) {
      <div class="usuario">
        <strong>{{ u.nombre }}</strong>
        <span>{{ u.rol }}@if (u.areaNombre) { · {{ u.areaNombre }} }</span>
        <span class="correo">{{ u.correo }}</span>
        <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    }
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
